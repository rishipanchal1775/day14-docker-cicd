
name: docker-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    env:
      LOCAL_IMAGE: winter-arc-app:${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: winter-arc-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eu
          docker run -d --name api -p 5000:5000 "$LOCAL_IMAGE"

          for i in {1..10}; do
            if curl -fsS http://localhost:5000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done

          docker logs api
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: winter-arc-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image for Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$LOCAL_IMAGE" \
            "${{ secrets.DOCKERHUB_USERNAME }}/winter-arc-app:${{ github.sha }}"

      - name: Publish SHA-tagged image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/winter-arc-app:${{ github.sha }}"
